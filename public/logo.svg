<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 56" fill="none" width="280" height="56">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C58F7" />
      <stop offset="100%" stop-color="#4E27C9" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B83D" />
      <stop offset="100%" stop-color="#E29618" />
    </linearGradient>
  </defs>

  <!-- Icon Mark: Stylized Biometric concentric arcs -->
  <g transform="translate(4, 4)">
    <rect width="48" height="48" rx="14" fill="url(#logo-grad)" />
    <!-- Stylized Arcs representing innate potential & fingerprint ridges -->
    <path d="M 24 12 A 12 12 0 0 1 36 24" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.95"/>
    <path d="M 12 24 A 12 12 0 0 1 24 12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.95"/>
    
    <path d="M 16 25 A 8 8 0 0 1 24 17 A 8 8 0 0 1 32 25" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M 19 28 A 5 5 0 0 1 24 22 A 5 5 0 0 1 29 28" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.85"/>
    
    <!-- Central spark/dot representing talent node -->
    <circle cx="24" cy="30" r="2.2" fill="url(#accent-grad)" />
    <path d="M 24 33 V 37" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <path d="M 18 34 Q 24 38 30 34" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Wordmark Text -->
  <g transform="translate(64, 12)">
    <text x="0" y="21" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#1B1535" letter-spacing="-0.5">Inborn Talent</text>
    <text x="1" y="36" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#6B46F0" letter-spacing="0.3">by Vivek Koche</text>
  </g>
</svg>
